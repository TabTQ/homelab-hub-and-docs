<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Homelab Hub is not reachable</title>
<style>
  :root { --bg: #e8ecef; --ink: #13202b; --muted: #54626f; --accent: #c2410c; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f171d; --ink: #e4eaee; --muted: #93a1ad; --accent: #ff8a4c; --accent-ink: #1a0e07; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 30rem; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach Homelab Hub</h1>
  <p>Your device has no route to the server right now. Check that you are on your home Wi-Fi, or that Tailscale is connected, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
