<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Homelab Hub is not reachable</title>
<style>
  :root { --bg: #04090b; --ink: #e6efec; --muted: #8b9b98; --line: #1d2d2f; --accent: #40c1ac; --accent-ink: #04090b; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 30rem; border: 1px solid var(--line); padding: 24px 26px; }
  h1 { font: 500 1.5rem Georgia, "Times New Roman", serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  button { font: inherit; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 0; padding: 10px 18px; margin-top: 8px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach Homelab Hub</h1>
  <p>Your device has no route to the server right now. Check that you are on your home Wi-Fi, or that Tailscale is connected, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
