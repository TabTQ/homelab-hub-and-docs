<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Single Page Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Direction A "Signal". Light tokens live on bare :root; dark overrides follow. */
:root{
  --bg:#E8ECEF; --surface:#F6F8F9; --surface2:#DDE3E8; --ink:#13202B; --muted:#54626F; --line:#C4CDD5;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#F6DCCF;
  --ok:#237A3B; --warn:#B45309; --bad:#B42323; --off:#8A96A1;
  --radius:4px; --radius-lg:6px;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --mb:44px; --stick:100px; --panelw:clamp(320px,22vw,400px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F171D;--surface:#172129;--surface2:#202C36;--ink:#E4EAEE;--muted:#93A1AD;--line:#2C3944;--accent:#FF8A4C;--accent-ink:#1A0E07;--accent-soft:#3A2418;--ok:#4CC46F;--warn:#F0A040;--bad:#FF6B6B;--off:#667480;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F171D;--surface:#172129;--surface2:#202C36;--ink:#E4EAEE;--muted:#93A1AD;--line:#2C3944;--accent:#FF8A4C;--accent-ink:#1A0E07;--accent-soft:#3A2418;--ok:#4CC46F;--warn:#F0A040;--bad:#FF6B6B;--off:#667480;color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Mockup controls (not part of the design) */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--ink);color:var(--bg);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:8px 16px;font:500 12px/1.2 var(--f-mono)}
.mockbar .mg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mockbar .lbl{opacity:.6;margin-right:4px;text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.mockbar button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);padding:4px 9px;border-radius:3px}
.mockbar button[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* Shell: same header, tokens and components as the dashboard mockup */
.wrap{max-width:2200px;margin:0 auto;padding:0 clamp(16px,3vw,56px)}
.top{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{font:600 1.2rem var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;background:var(--accent);display:inline-block;border-radius:2px}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:6px 12px;color:var(--muted);border-radius:var(--radius);font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface2)}
.grow{flex:1}
.scope{font:500 11.5px var(--f-mono);color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px;white-space:nowrap}
.scope b{color:var(--ok);font-weight:500}
.kbd-search{display:flex;align-items:center;gap:10px;min-width:min(100%,250px);background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:var(--radius)}
.kbd-search kbd{margin-left:auto;font:500 11px var(--f-mono);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
[data-view="public"] .int-only{display:none!important}
[data-view="internal"] .pub-only{display:none!important}

/* In-page section nav */
.subnav{position:sticky;top:var(--mb);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.subnav a{padding:10px 12px;text-decoration:none;color:var(--muted);font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border-bottom:2px solid transparent}
.subnav a:hover{color:var(--ink)}
.subnav a.here{color:var(--ink);border-bottom-color:var(--accent)}
.subnav .n{color:var(--accent);margin-left:6px}

/* Layout: content + collapsible skill panel */
.page{display:grid;grid-template-columns:minmax(0,1fr) var(--panelw);gap:28px;align-items:start;padding-top:22px;padding-bottom:80px;transition:grid-template-columns .2s}
.page.collapsed{grid-template-columns:minmax(0,1fr) 46px}
@media (prefers-reduced-motion:reduce){.page{transition:none}}
.ribbon{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);padding:9px 14px;border-radius:var(--radius);margin:0 0 22px;font-size:13.5px}
.banner{border:1px solid var(--accent);background:var(--surface);border-radius:var(--radius);padding:10px 14px;margin:0 0 22px;font-size:13.5px}
.banner .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.banner .hid{color:var(--muted);margin-top:4px}
.btn{background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:var(--radius);font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:2px 8px;font:500 11.5px var(--f-mono)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}

.sec{margin:0 0 44px;scroll-margin-top:calc(var(--stick) + 8px)}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.tape{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:2px;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h .ct{font:500 12px var(--f-mono);color:var(--muted)}
.sec.empty{margin:0 0 12px;opacity:.75}
.sec.empty .sec-h{margin:0}
.sec.empty .tape{background:var(--surface2);color:var(--muted)}
h1{font:600 clamp(1.9rem,1.3rem + 2.4vw,3rem)/1.05 var(--f-display);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h3{font:600 1.1rem/1.25 var(--f-display);margin:0;letter-spacing:-.005em}
.eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.lede{font-size:1.05rem;max-width:72ch;margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13.5px;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.about{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px clamp(24px,4vw,64px);align-items:start}
.about .stats{grid-template-columns:repeat(2,minmax(0,1fr));margin:6px 0 0}
.about .stat{padding:14px 16px}
.about .stat .v{font-size:2rem}
@media (max-width:1500px){.about{grid-template-columns:1fr}.about .stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.about .stat .v{font-size:1.7rem}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat .v{font:600 1.6rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.stat .s{color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--radius-lg);padding:16px 18px;margin:0 0 14px;position:relative}
.card.dim,.dim{opacity:.32}
.card .edit{position:absolute;top:10px;right:10px}
.card h3{padding-right:64px}
.role-meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:13.5px;margin:3px 0 10px}
.role-meta .when{font-family:var(--f-mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}
.chip{font:400 11.5px var(--f-mono);background:var(--surface2);border:1px solid transparent;padding:1px 7px;border-radius:2px;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.tag{cursor:default;background:transparent;border-color:var(--line);color:var(--muted)}
details{margin:10px 0 0}
summary{cursor:pointer;font-weight:500;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";font-family:var(--f-mono)}
details[open]>summary::before{content:"\2212 "}
.hl{margin:8px 0 0;padding-left:18px}
.hl li{margin:0 0 6px}
li.hit,.hit{background:var(--accent-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:14px;align-items:start}
.cols .card{margin:0}
.card>p,.card details>p{max-width:96ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.grid3 .card{margin:0}
.tablewrap{overflow-x:auto;margin:12px 0 4px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--ink)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.after{font-weight:600}
td.after.accent{color:var(--accent)}
.dl{margin:8px 0 0}
.dl li{border-top:1px solid var(--line);padding:9px 0;list-style:none}
.dl{padding:0}
.dl .t{font-weight:600}
.dl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.edu ul{list-style:none;margin:0;padding:0}
.edu li{padding:10px 0;border-top:1px solid var(--line)}
.edu li .t{font-weight:600}
.edu li .m{color:var(--muted);font-size:13.5px}
.dev{margin:0 0 20px}
.dev>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}
.hw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;margin:12px 0}
.hw div{border-top:1px solid var(--line);padding-top:5px}
.hw dt{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hw dd{margin:0;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:4px}
.kv span:first-child{color:var(--muted)}
.state{font:500 11.5px var(--f-mono)}
.state.up{color:var(--ok)} .state.warn{color:var(--warn)}
.sub-h{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 8px}
.none{color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);padding:10px 14px;font-size:13.5px}
.contact{display:flex;flex-wrap:wrap;gap:8px 28px}
.contact div{min-width:200px}
.contact .v{font-family:var(--f-mono);font-size:14px;user-select:all}
.badge-new{font:500 10.5px var(--f-mono);color:var(--warn);border:1px solid var(--warn);padding:0 5px;border-radius:2px;margin-left:8px;vertical-align:middle}

/* Skill panel */
.panel{position:sticky;top:var(--stick);max-height:calc(100vh - var(--stick) - 12px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--radius-lg)}
.pbody{padding:14px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.phead h2{margin:0}
.iconbtn{background:var(--surface2);border:1px solid var(--line);width:30px;height:30px;border-radius:var(--radius);display:grid;place-items:center;font:600 14px var(--f-mono)}
.iconbtn:hover{border-color:var(--ink)}
.psearch{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink)}
.psearch:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.ptools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--surface);border:0;padding:4px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.active{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px;min-height:0}
.active .chip{padding:3px 8px;font-size:12px}
.active .chip::after{content:" \00d7";opacity:.8}
.pgroup{border-top:1px solid var(--line)}
.pgroup summary{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.pgroup summary::before{content:"\25B8";margin-right:6px;color:var(--muted)}
.pgroup[open] summary::before{content:"\25BE"}
.pgroup summary .c{color:var(--muted);margin-left:auto}
.pgroup .chips{margin:0 0 12px}
.sk{font:400 12px var(--f-mono);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:2px;display:inline-flex;gap:6px}
.sk .n{color:var(--muted)}
.sk:hover{border-color:var(--accent)}
.sk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sk[aria-pressed="true"] .n{color:inherit}
.sk.zero{border-style:dashed;color:var(--muted)}
.sk.rel{background:var(--accent-soft);border-color:var(--accent)}
.pfoot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.rail{display:none;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.rail .vt{writing-mode:vertical-rl;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.12em}
.rail .bd{background:var(--accent);color:var(--accent-ink);font:600 12px var(--f-mono);min-width:22px;text-align:center;border-radius:2px;padding:1px 4px}
.collapsed .pbody{display:none}
.collapsed .rail{display:flex}
.collapsed .panel{cursor:pointer}
.fab{display:none}
.scrim{display:none}

@media (max-width:900px){
  .page,.page.collapsed{display:block}
  .panel{position:fixed;top:0;right:0;bottom:0;max-height:none;width:min(92vw,390px);z-index:80;border-radius:0;transform:translateX(105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .panel.open{transform:none}
  .collapsed .pbody{display:block}
  .collapsed .rail{display:none}
  .fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;gap:8px;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 18px;font:600 13px var(--f-mono);box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(8,10,16,.55);z-index:75}
  .scope{display:none}
}

/* Palette */
.overlay{position:fixed;inset:0;background:rgba(8,10,16,.62);display:grid;place-items:start center;padding:12vh 16px 16px;z-index:100}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-lg);width:min(600px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog input{width:100%;font:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 16px;color:var(--ink)}
.dialog input:focus{outline:none;border-bottom-color:var(--accent)}
.res{max-height:50vh;overflow:auto;padding:6px}
.res .gl{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:8px 10px 4px}
.res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--radius)}
.res button[aria-selected="true"]{background:var(--accent-soft)}
.res .hint{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);z-index:200;font-size:14px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
</style>
</head>
<body data-view="public">
<div class="mockbar" id="mockbar" role="toolbar" aria-label="Mockup controls">
  <div class="mg"><span class="lbl">View</span><button data-view-btn="public" aria-pressed="true">Public site</button><button data-view-btn="internal" aria-pressed="false">Internal (editing)</button></div>
  <div class="mg"><span class="lbl">Theme</span><button data-theme-btn="system" aria-pressed="true">System</button><button data-theme-btn="light" aria-pressed="false">Light</button><button data-theme-btn="dark" aria-pressed="false">Dark</button></div>
  <div class="mg"><span class="lbl">Try</span><button data-demo="none">No filter</button><button data-demo="py">Python 3 + Redshift</button><button data-demo="docker">Docker / Compose</button><button data-demo="dead">Search “deadlock”</button></div>
</div>

<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i><span class="int-only">Homelab Hub</span><span class="pub-only">Tabish Tariq</span></div>
    <nav class="nav int-only" aria-label="Main"><button>Dashboard</button><button aria-current="page">Portfolio</button><button>Config</button></nav>
    <span class="grow"></span>
    <span class="scope int-only"><b>&#9679;</b> Internal &middot; LAN + Tailscale</span>
    <button class="kbd-search" id="openPalette" aria-label="Search portfolio"><span>Search portfolio</span><kbd>Ctrl K</kbd></button>
  </header>
</div>
<nav class="subnav" id="subnav" aria-label="Sections"><div class="wrap" id="subnavIn"></div></nav>

<div class="wrap">
  <div class="page" id="page">
    <main id="content"></main>
    <aside class="panel" id="panel" aria-label="Skill filter">
      <button class="rail" id="rail" aria-label="Open skill filter"><span class="bd" id="railBd">0</span><span class="vt">Skills</span><span aria-hidden="true">&laquo;</span></button>
      <div class="pbody">
        <div class="phead"><h2 class="tape">Skill filter</h2><button class="iconbtn" id="collapse" aria-label="Collapse skill filter" title="Collapse">&raquo;</button></div>
        <input class="psearch" id="psearch" type="search" placeholder="Search skills or any text" aria-label="Search skills or page text" autocomplete="off">
        <div class="ptools">
          <div class="seg" role="group" aria-label="Skill match mode"><button data-mode="all" aria-pressed="true">Match all</button><button data-mode="any" aria-pressed="false">Match any</button></div>
          <div class="seg" role="group" aria-label="Non-matching items"><button data-vis="hide" aria-pressed="true">Hide others</button><button data-vis="dim" aria-pressed="false">Dim others</button></div>
        </div>
        <div class="active" id="active" aria-live="polite"></div>
        <div id="groups"></div>
        <div class="pfoot" id="pfoot"></div>
      </div>
    </aside>
  </div>
</div>
<button class="fab" id="fab" aria-label="Open skill filter">Skills <span id="fabN"></span></button>
<div class="scrim" id="scrim"></div>

<div class="overlay" id="paletteOv" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-label="Search portfolio">
    <input type="text" id="q" placeholder="Jump to a section, project, role or skill" autocomplete="off">
    <div class="res" id="res" role="listbox"></div>
  </div>
</div>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const S={picked:new Set(),mode:'all',vis:'hide',q:'',open:new Set(),view:'public'};
const tokens=()=>S.q.toLowerCase().split(/\s+/).filter(Boolean);
const txtOK=t=>tokens().every(k=>t.includes(k));
const skOK=sk=>!S.picked.size||(S.mode==='all'?[...S.picked].every(s=>sk.includes(s)):[...S.picked].some(s=>sk.includes(s)));
const M=e=>skOK(e.skills)&&txtOK(e.t);
const active=()=>S.picked.size>0||tokens().length>0;

/* Every homelab item counts as a match if it, or anything below it, matches. */
const devKids=h=>({cts:h.containers.filter(M),svs:h.services.filter(M),nets:h.network.filter(M)});
const devMatch=h=>{const k=devKids(h); return M(h)||k.cts.length||k.svs.length||k.nets.length;};

const chip=(l)=>`<button class="chip ${S.picked.has(l)?'on':''}" data-skill="${esc(l)}" title="Filter by ${esc(l)}">${esc(l)}</button>`;
const chips=(e)=>(e.skills&&e.skills.length||e.tags&&e.tags.length)?`<div class="chips">${(e.skills||[]).map(chip).join('')}${(e.tags||[]).map(t=>`<span class="chip tag" title="Free-text tag, not linked to a skill">${esc(t)}</span>`).join('')}</div>`:'';
const editBtn=(what)=>`<button class="btn sm edit int-only" data-edit="${esc(what)}">Edit</button>`;
const shown=(e,fn)=>{ const m=fn?fn(e):M(e); return S.vis==='hide'?m:true; };
const dimCls=(e,fn)=>{ const m=fn?fn(e):M(e); return (!m&&S.vis==='dim')?' dim':''; };
const sec=(id,title,count,body,edit)=>body.startsWith('<div class="none">')?`<section class="sec empty" id="${id}"><div class="sec-h"><h2 class="tape">${title}</h2><span class="rule"></span><span class="ct">no matches</span></div></section>`:`<section class="sec" id="${id}"><div class="sec-h"><h2 class="tape">${title}</h2><span class="rule"></span><span class="ct">${count}</span>${edit?`<button class="btn sm int-only" data-edit="${esc(title)}: add">Add</button>`:''}</div>${body}</section>`;

function hasHit(list){ return tokens().length && list.some(x=>txtOK(x.toLowerCase())); }
function highlights(e){
  const open=S.open.has('h:'+e.id)||hasHit(e.highlights);
  return `<details data-k="h:${e.id}" ${open?'open':''}><summary>${e.highlights.length} highlights</summary><ul class="hl">${e.highlights.map(h=>`<li class="${tokens().length&&txtOK(h.toLowerCase())?'hit':''}">${esc(h)}</li>`).join('')}</ul></details>`;
}

function renderAbout(){
  const p=D.profile, m=!active()||M(p);
  if(!m&&S.vis==='hide') return sec('about','About','hidden by filter','<div class="none">About is not linked to any skill. Clear the filter to read it.</div>');
  return sec('about','About','',`<div class="about${dimCls(p)}"><div class="about-text"><h1>${esc(p.name)}</h1><div class="lede"><b>${esc(p.title)}</b> &middot; ${esc(p.tagline)}</div>
   <div class="meta"><span>${esc(p.location)}</span><span>${esc(p.status)}</span><span>${esc(p.brand)}</span></div>
   ${p.bio.map(b=>`<p class="lede">${esc(b)}</p>`).join('')}</div>
   <div class="stats">${p.stats.map(s=>`<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div><div class="s">${esc(s.sub)}</div></div>`).join('')}</div></div>`,0);
}

function renderProjects(){
  const all=D.projects, list=all.filter(p=>shown(p)), fl=list.filter(p=>p.kind==='flagship'), sm=list.filter(p=>p.kind!=='flagship');
  const flag=fl.map(p=>{

    <details data-k="d:${p.id}" ${(S.open.has('d:'+p.id)||tokens().length&&dl.length)?'open':''}><summary>${dl.length} deliverable${dl.length===1?'':'s'}${dl.length<p.deliverables.length?' of '+p.deliverables.length:''}</summary><ul class="dl">${dl.map(x=>`<li><div class="t">${esc(x.title)} <span class="chip tag">${esc(x.tag)}</span></div><p>${esc(x.body)}</p></li>`).join('')}</ul></details>${chips(p)}</article>`;
  }).join('');
  const small=sm.length?`<div class="sub-h">Other projects</div><div class="grid3">${sm.map(p=>`<article class="card${dimCls(p)}" id="${p.id}">${editBtn('Project: '+p.title)}<div class="eyebrow">${esc(p.type)}</div><h3 style="margin-top:2px;font-size:1rem">${esc(p.title)}</h3><p style="margin:6px 0 0;font-size:14px">${esc(p.description)}</p>${chips(p)}${p.repo?`<p style="margin:10px 0 0"><a href="#" data-link="${esc(p.repo)}" class="mono" style="font-size:12.5px">Source on GitHub &nearr;</a></p>`:''}</article>`).join('')}</div>`:'';
  return sec('projects','Projects',`${all.filter(M).length} of ${all.length}`,(flag+small)||'<div class="none">No project matches this filter.</div>',1);
}
function renderEdu(){

function renderLab(){

  const body=vis.length?vis.map(h=>{
    const k=devKids(h), hide=S.vis==='hide';
    const cts=hide?k.cts:h.containers, svs=hide?k.svs:h.services, nets=hide?k.nets:h.network;

      ${chips(h)}
      ${cts.length?`<div class="sub-h">Containers <span class="badge-new" title="Skill links for homelab items are a proposed addition">skills linked: proposed</span></div><div class="grid3">${cts.map(c=>`<div class="card${dimCls(c)}" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.name)}</b><span class="state ${c.status==='Active'?'up':'warn'}">${esc(c.status)}</span></div><div class="kv"><span>ID</span><span class="mono">${esc(c.id.replace('lxc-',''))}</span></div><div class="kv"><span>Purpose</span><span>${esc(c.purpose)}</span></div><div class="kv"><span>Resources</span><span class="mono">${esc(c.res)}</span></div>${chips(c)}</div>`).join('')}</div>`:''}
      ${svs.length?`<div class="sub-h">Services</div><div class="grid3">${svs.map(s=>`<div class="card${dimCls(s)}" style="padding:12px 14px"><b>${esc(s.name)}</b><div class="kv"><span>Function</span><span style="text-align:right">${esc(s.fn)}</span></div><div class="kv"><span>Container</span><span class="mono">${esc(s.ct)}</span></div><div class="kv"><span>Port</span><span class="mono">${esc(s.port)}</span></div>${chips(s)}</div>`).join('')}</div>`:''}
      ${g('isp').length?`<div class="sub-h">Uplinks</div><div class="grid2">${g('isp').map(n=>`<div class="card" style="padding:12px 14px"><b>${esc(n.name)}</b><div style="color:var(--muted);font-size:13.5px">${esc(n.spec.spec)}</div></div>`).join('')}</div>`:''}
      ${g('vlan').length?`<div class="sub-h">VLANs</div><div class="grid2">${g('vlan').map(n=>`<div class="card" style="padding:12px 14px"><b>${esc(n.name)}</b><div class="kv"><span>Subnet</span><span class="mono">${esc(n.spec.subnet)}</span></div><div class="kv"><span>Role</span><span style="text-align:right">${esc(n.spec.role)}</span></div></div>`).join('')}</div>`:''}
      ${g('switch').length?`<div class="sub-h">Switches</div><div class="grid3">${g('switch').map(n=>`<div class="card" style="padding:12px 14px"><b>${esc(n.name)}</b><div class="kv"><span>Type</span><span>${esc(n.spec.type)}</span></div><div class="kv"><span>Role</span><span style="text-align:right">${esc(n.spec.role)}</span></div></div>`).join('')}</div>`:''}
    </article>`;
  }).join(''):'<div class="none">No homelab item matches this filter.</div>';
  const total=devs.reduce((a,h)=>a+1+h.containers.length+h.services.length,0), hit=devs.reduce((a,h)=>{const k=devKids(h);return a+(M(h)?1:0)+k.cts.length+k.svs.length},0);
  return sec('homelab','Homelab',`${hit} of ${total}`,body,1);
}
function renderContact(){
  const p=D.profile, s=p.socials, m=!active()||M(p);
  if(!m&&S.vis==='hide') return sec('contact','Contact','hidden by filter','<div class="none">Contact details are not linked to any skill.</div>');
  return sec('contact','Contact','',`<div class="contact ${dimCls(p).trim()}"><div><div class="eyebrow">Email</div><div class="v">${esc(p.email)}</div></div><div><div class="eyebrow">Phone</div><div class="v">${esc(p.phone)}</div></div><div><div class="eyebrow">GitHub</div><a class="v" href="#" data-link="${esc(s.github)}">${esc(s.githubLabel)}</a></div><div><div class="eyebrow">LinkedIn</div><a class="v" href="#" data-link="${esc(s.linkedin)}">${esc(s.linkedinLabel)}</a></div></div>`,0);
}

function banner(){
  const el=[];
  if(S.view==='internal') el.push(`<div class="ribbon"><span><b>Editing view.</b> Saves publish to the public site (port 3011) within seconds. Last publish 12 s ago.</span><button class="btn" data-view-btn="public">Preview as public</button></div>`);
  if(active()){
    const cnt={Experience:D.experience.filter(M).length,Projects:D.projects.filter(M).length,Education:D.education.filter(M).length,Homelab:D.homelab.reduce((a,h)=>{const k=devKids(h);return a+(M(h)?1:0)+k.cts.length+k.svs.length},0)};
    const none=Object.entries(cnt).filter(([,n])=>!n).map(([k])=>k);
    el.push(`<div class="banner" role="status"><div class="row"><b>Showing what matches</b>${[...S.picked].map(chip).join('')}${tokens().length?`<span class="chip tag">text: ${esc(S.q)}</span>`:''}<span>&middot; ${Object.entries(cnt).filter(([,n])=>n).map(([k,n])=>`${k} ${n}`).join(' &middot; ')||'nothing'}</span><button class="linkbtn" data-clear>Clear all</button></div>${none.length?`<div class="hid">No matches in: ${none.join(', ')}${S.vis==='hide'?' (collapsed)':''}</div>`:''}</div>`);
  }
  return el.join('');
}
function renderContent(){
  $('#content').innerHTML=banner()+renderAbout()+renderExp()+renderProjects()+renderEdu()+renderLab()+renderContact();
  const N={experience:D.experience.filter(M).length,projects:D.projects.filter(M).length,education:D.education.filter(M).length,homelab:D.homelab.reduce((a,h)=>{const k=devKids(h);return a+(M(h)?1:0)+k.cts.length+k.svs.length},0)};
  $('#subnavIn').innerHTML=[['about','About'],['experience','Experience'],['projects','Projects'],['education','Education'],['homelab','Homelab'],['contact','Contact']].map(([id,l])=>`<a href="#${id}" data-sec="${id}">${l}${active()&&N[id]!=null?`<span class="n">${N[id]}</span>`:''}</a>`).join('');
  markHere();
}

/* ---- Skill panel ---- */
function renderPanel(){
  const qt=tokens(), matched=[]; D.experience.filter(M).forEach(e=>matched.push(...e.skills)); D.projects.filter(M).forEach(e=>matched.push(...e.skills));
  D.homelab.forEach(h=>{ if(M(h)) matched.push(...h.skills); const k=devKids(h); k.cts.forEach(c=>matched.push(...c.skills)); k.svs.forEach(c=>matched.push(...c.skills)); });
  const rel=new Set(matched);
  const nameOK=l=>!qt.length||qt.every(t=>l.toLowerCase().includes(t));
  let any=false;
  $('#groups').innerHTML=D.skills.map(g=>{
    const list=g.skills.filter(s=>nameOK(s.l)); if(!list.length) return ''; any=true;
    const open=list.some(s=>S.picked.has(s.l))||S.open.has('g:'+g.name)||(qt.length>0);
    return `<details class="pgroup" data-k="g:${esc(g.name)}" ${open?'open':''}><summary>${esc(g.name)}<span class="c">${g.skills.filter(s=>s.n).length}/${g.skills.length}</span></summary><div class="chips">${list.map(s=>`<button class="sk ${s.n?'':'zero'} ${S.picked.size&&rel.has(s.l)&&!S.picked.has(s.l)?'rel':''}" data-skill="${esc(s.l)}" aria-pressed="${S.picked.has(s.l)}" title="${s.n?s.n+' linked item'+(s.n===1?'':'s'):'No linked content yet'}">${esc(s.l)}<span class="n">${s.n||'—'}</span></button>`).join('')}</div></details>`;
  }).join('') || `<div class="none">No skill name matches “${esc(S.q)}”. The page text filter still applies.</div>`;
  $('#active').innerHTML=[...S.picked].map(chip).map(h=>h.replace('class="chip on"','class="chip on" aria-label="Remove"')).join('');
  const total=D.skills.reduce((a,g)=>a+g.skills.length,0), cov=D.skills.reduce((a,g)=>a+g.skills.filter(s=>s.n).length,0);
  $('#pfoot').textContent=`${cov} of ${total} skills have linked content. Dashed skills are listed but not linked to any role, project or homelab item yet.`;
  const n=S.picked.size+(qt.length?1:0); $('#railBd').textContent=n; $('#fabN').textContent=n?'· '+n:'';
  $$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode)); $$('[data-vis]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.vis===S.vis));
}
function all(){ renderContent(); renderPanel(); }
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k; if(!k) return; e.target.open?S.open.add(k):S.open.delete(k);},true);

/* ---- Interactions ---- */
let tt; function toast(m){const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3600);}
document.addEventListener('click',e=>{
  const sk=e.target.closest('[data-skill]'); if(sk){const s=sk.dataset.skill; S.picked.has(s)?S.picked.delete(s):S.picked.add(s); all(); return;}
  if(e.target.closest('[data-clear]')){S.picked.clear(); S.q=''; $('#psearch').value=''; all(); return;}
  const mo=e.target.closest('[data-mode]'); if(mo){S.mode=mo.dataset.mode; all(); return;}
  const vi=e.target.closest('[data-vis]'); if(vi){S.vis=vi.dataset.vis; all(); return;}
  const ed=e.target.closest('[data-edit]'); if(ed){toast('Mockup: would open the editor for “'+ed.dataset.edit+'”.'); return;}
  const lk=e.target.closest('[data-link]'); if(lk){e.preventDefault(); toast('Would open '+lk.dataset.link+' in a new tab.'); return;}
  const vb=e.target.closest('[data-view-btn]'); if(vb){setView(vb.dataset.viewBtn); return;}
  const sc=e.target.closest('.subnav a'); if(sc){ /* native anchor scroll */ }
});
$('#psearch').addEventListener('input',e=>{S.q=e.target.value; all();});
function setCollapsed(c){ $('#page').classList.toggle('collapsed',c); $('#collapse').textContent=c?'«':'»'; store.set('hub-panel',c?'1':'0'); }
$('#collapse').onclick=()=>{ if(matchMedia('(max-width:900px)').matches) closeDrawer(); else setCollapsed(true); };
$('#rail').onclick=()=>setCollapsed(false);
function openDrawer(){ $('#panel').classList.add('open'); $('#scrim').classList.add('show'); }
function closeDrawer(){ $('#panel').classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#fab').onclick=openDrawer; $('#scrim').onclick=closeDrawer;

function setView(v){ S.view=v; document.body.dataset.view=v; $$('[data-view-btn]').forEach(b=>b.closest('.mockbar')&&b.setAttribute('aria-pressed',b.dataset.viewBtn===v)); all(); }
function setTheme(t){ if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme=t; $$('[data-theme-btn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeBtn===t)); store.set('hub-theme',t); }
$$('[data-theme-btn]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeBtn));
const DEMO={none:()=>{S.picked.clear();S.q='';},py:()=>{S.picked=new Set(['Python 3','Amazon Redshift']);S.q='';S.mode='all';},docker:()=>{S.picked=new Set(['Docker / Compose']);S.q='';},dead:()=>{S.picked.clear();S.q='deadlock';}};
$$('[data-demo]').forEach(b=>b.onclick=()=>{DEMO[b.dataset.demo](); $('#psearch').value=S.q; all(); window.scrollTo({top:0});});

/* Sticky offsets follow the real height of the mockup bar and section nav */
function measure(){ const mb=$('#mockbar').offsetHeight; document.documentElement.style.setProperty('--mb',mb+'px'); document.documentElement.style.setProperty('--stick',(mb+$('#subnav').offsetHeight+10)+'px'); }
new ResizeObserver(measure).observe($('#mockbar')); window.addEventListener('resize',measure);
function markHere(){ const y=window.scrollY+parseInt(getComputedStyle(document.documentElement).getPropertyValue('--stick'))+40; let cur='about'; ['about','experience','projects','education','homelab','contact'].forEach(id=>{const el=document.getElementById(id); if(el&&el.offsetTop<=y) cur=id;}); $$('.subnav a').forEach(a=>a.classList.toggle('here',a.dataset.sec===cur)); }
window.addEventListener('scroll',markHere,{passive:true});

/* Palette */
const INDEX=[...[['about','About'],['experience','Experience'],['projects','Projects'],['education','Education'],['homelab','Homelab'],['contact','Contact']].map(([id,t])=>({g:'Sections',t,d:'Jump to',jump:id})),
 ...D.experience.map(e=>({g:'Experience',t:e.role,d:e.company,jump:e.id})),...D.projects.map(p=>({g:'Projects',t:p.title,d:p.kind,jump:p.id})),
 ...D.homelab.map(h=>({g:'Homelab',t:h.name,d:h.ip||'',jump:h.id})),
 ...D.skills.flatMap(g=>g.skills.map(s=>({g:'Skills',t:s.l,d:s.n?s.n+' linked':'no linked content',skill:s.l})))];
let sel=0,shownR=[];
function drawPal(){ const t=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean); shownR=INDEX.filter(x=>t.every(k=>(x.t+' '+x.d+' '+x.g).toLowerCase().includes(k))).slice(0,t.length?30:12); sel=Math.min(sel,Math.max(0,shownR.length-1)); let last=''; $('#res').innerHTML=shownR.length?shownR.map((x,i)=>{const h=x.g!==last?`<div class="gl">${x.g}</div>`:''; last=x.g; return h+`<button role="option" data-i="${i}" aria-selected="${i===sel}"><span>${esc(x.t)}</span><span class="hint">${esc(x.d)}</span></button>`}).join(''):'<div class="gl">No matches</div>'; }
function openPal(){ $('#paletteOv').hidden=false; $('#q').value=''; sel=0; drawPal(); $('#q').focus(); }
function closePal(){ $('#paletteOv').hidden=true; }
function run(x){ closePal(); if(x.skill){S.picked.add(x.skill); all(); if(matchMedia('(min-width:901px)').matches) setCollapsed(false); return;} if(x.jump){ S.picked.clear(); S.q=''; $('#psearch').value=''; all(); setTimeout(()=>document.getElementById(x.jump)?.scrollIntoView({behavior:'smooth',block:'start'}),30);} }
$('#openPalette').onclick=openPal; $('#q').addEventListener('input',()=>{sel=0;drawPal()});
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(b) run(shownR[+b.dataset.i]);});
$('#paletteOv').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closePal(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); $('#paletteOv').hidden?openPal():closePal(); return;}
  if(e.key==='Escape'){ if(!$('#paletteOv').hidden) closePal(); else closeDrawer(); return; }
  if($('#paletteOv').hidden) return;
  if(e.key==='ArrowDown'){e.preventDefault(); sel=Math.min(sel+1,shownR.length-1); drawPal(); $('[aria-selected="true"]',$('#res'))?.scrollIntoView({block:'nearest'});}
  if(e.key==='ArrowUp'){e.preventDefault(); sel=Math.max(sel-1,0); drawPal(); $('[aria-selected="true"]',$('#res'))?.scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'&&shownR[sel]){e.preventDefault(); run(shownR[sel]);}
});

setTheme(store.get('hub-theme','system')); setCollapsed(store.get('hub-panel','0')==='1'); measure(); all();
</script>
